<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Notes Heaven</title>
  <meta name="description" content="Join Notes Heaven to create, organize, and revise engineering and college notes.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/index.html" class="auth-logo">
          <div class="logo-icon">NH</div>
          <div class="logo-text">Notes<span>Heaven</span></div>
        </a>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join Notes Heaven to start organizing your study materials</p>
      </div>

      <div id="alertBox" class="alert-box" role="alert"></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input 
            type="text" 
            id="name" 
            class="form-input" 
            placeholder="Alex Smith" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="alex@college.edu" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary auth-btn-block">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign In</a>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <button class="btn-icon theme-toggle-btn" title="Toggle Dark/Light Mode">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
