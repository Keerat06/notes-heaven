<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Notes Heaven</title>
  <meta name="description" content="Sign in to your Notes Heaven account to access your student notes and revisions.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/index.html" class="auth-logo">
          <div class="logo-icon">NH</div>
          <div class="logo-text">Notes<span>Heaven</span></div>
        </a>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Enter your credentials to access your study notes</p>
      </div>

      <div id="alertBox" class="alert-box" role="alert"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="student@college.edu" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary auth-btn-block">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create one here</a>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <button class="btn-icon theme-toggle-btn" title="Toggle Dark/Light Mode">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
